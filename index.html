const NAME = "SaveText.xlsb";
const MIME = "application/vnd.ms-excel.sheet.macroEnabled.12";
const EXT  = "xlsb";

async function build(){
  const s = document.getElementById("s");
  try{
    const bin = atob(B64.replace(/\s/g,""));
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);

    if(window.showSaveFilePicker){
      const h = await window.showSaveFilePicker({
        suggestedName: NAME,
        types:[{description:"Excel Macro Workbook",
                accept:{"application/vnd.ms-excel.sheet.macroEnabled.12":[".xlsb"]}}]
      });
      const w = await h.createWritable();
      await w.write(bytes);
      await w.close();
      s.textContent = "تم البناء محليًا — الملف نضيف بدون قفل.";
    } else {
      // Firefox / متصفح قديم → تنزيل عادي (سيُقفل)
      const url = URL.createObjectURL(new Blob([bytes],{type:MIME}));
      const a = document.createElement("a");
      a.href = url; a.download = NAME; a.click();
      URL.revokeObjectURL(url);
      s.textContent = "متصفحك لا يدعم API — نُزّل عاديًا (مقفول). استخدم PowerShell للفكّ.";
    }
  }catch(e){
    if(e.name !== "AbortError") console.error(e);
    document.getElementById("s").textContent =
      e.name === "AbortError" ? "أُلغي الحفظ." : "خطأ: " + e.message;
  }
}
</script>
