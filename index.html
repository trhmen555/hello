
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download File</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .download-btn {
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #1677ff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background: #0056cc;
        }
    </style>
</head>
<body>

    <a href="./hello.rar" download="hello.rar">
        <button class="download-btn" type="button">
            Download 
        </button>
    </a>

</body>
</html>
